# Збірка Windows-пакета Тлумача з цього коду.
# Запускається вручну (Actions → Build → Run workflow) або при тезі v* (наприклад v1.3).
# Якщо при ручному запуску вказати версію, після збірки буде опубліковано реліз vВЕРСІЯ.
# Результат — артефакт Tlumach-win-x64 (непідписаний). Його ж потім підписує SignPath.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія для релізу (напр. 1.3). Порожньо = лише зібрати"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:   # тестова збірка для кожного PR (артефакт Tlumach-win-x64, без релізу)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (win-x64, Release)
        working-directory: Launcher
        run: dotnet build -c Release -r win-x64 -o out-win

      - name: Assemble package
        run: |
          set -e
          PKG=package/Tlumach
          mkdir -p "$PKG/app"
          python3 exe/make_exe.py Launcher/out-win/TranslationLauncher.exe "$PKG/Tlumach.exe"
          cp -r Launcher/out-win/. "$PKG/app/"
          rm -f "$PKG/app/TranslationLauncher.exe"
          rm -rf "$PKG/app/data"
          mkdir -p "$PKG/app/www" && cp Launcher/www/i18n.js "$PKG/app/www/"
          cp LICENSE TRADEMARKS.md THIRD_PARTY_NOTICES.txt "$PKG/"
          cp packaging/README_UA.md "$PKG/README_UA.txt"
          cp packaging/run-console.bat "$PKG/Запуск з консоллю (діагностика).bat"

      - uses: actions/upload-artifact@v4
        with:
          name: Tlumach-win-x64
          path: package/Tlumach
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="${{ inputs.version }}"
          [ -n "$VER" ] || VER="${GITHUB_REF_NAME#v}"
          ZIP="Tlumach-$VER.zip"
          (cd package && zip -qr "../$ZIP" Tlumach)
          SUM=$(sha256sum "$ZIP" | cut -d' ' -f1)
          sed -e "s/VERSION/$VER/g" -e "s/SHA256/$SUM/" packaging/release-notes.md > notes.md
          gh release create "v$VER" "$ZIP" --target "$GITHUB_SHA" --title "Тлумач $VER" --notes-file notes.md
